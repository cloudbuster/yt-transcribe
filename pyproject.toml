[project]
name = "yt-transcript-downloader"
version = "0.1.0"
description = "A modular pipeline for extracting and summarizing YouTube transcripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "youtube-transcript-api>=0.6.0",
    "ollama>=0.1.0",
    "rich>=13.0.0",
    "textual>=0.85.0",
    "httpx>=0.27.0",
]

[project.scripts]
yt-factory = "run_factory:main"
yt-check = "main:main"
yt-download = "download_transcript:main"
yt-summarize = "summarize_transcript:main"
yt-config = "configure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = []
